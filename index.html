<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="hi! nice to meet you :)">
<title>Nalani Chassang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=JetBrains+Mono:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* VOICE: casual, lowercase, warm — a personal page that says hi
   IDEA: the page is a JSON file about lani, opened in a browser's JSON viewer
   PICTURE: the JSON itself — syntax-coloured, foldable, with little // notes in the margins
   COLOUR and TYPE: Barbados ultramarine keys, gold strings, mono throughout
   LAYOUT: one column, top-left, like a file opened in a browser */
:root{
  color-scheme:light dark;
  --bg:light-dark(#ffffff,#0d1117);
  --ink:light-dark(#1f2328,#e6edf3);
  --muted:light-dark(#6e7781,#8b949e);
  --key:light-dark(#00267f,#7fa9ff);
  --str:light-dark(#8a5a00,#f2c14e);
  --note:light-dark(#57606a,#8b949e);
  --bar:light-dark(#f6f8fa,#161b22);
  --line:light-dark(#d0d7de,#30363d);
  --hl:light-dark(#fff3c4,#3a3115);
}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.65 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-x:clip}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;padding:6px 12px;background:var(--bar);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.bar label{display:inline-flex;align-items:center;gap:8px;min-height:32px;cursor:pointer;user-select:none}
.bar input{width:16px;height:16px;margin:0;accent-color:var(--key);cursor:pointer}
.bar button{font:inherit;color:var(--muted);background:none;border:0;padding:0;min-height:32px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.bar button:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--key);outline-offset:2px;border-radius:2px}
main{padding:14px 16px 56px;max-width:920px}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font:inherit}
.k{color:var(--key);font-weight:600}
.s{color:var(--str)}
.p{color:var(--muted)}
.c{color:var(--note);font-style:italic}
a{color:inherit;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
a:hover{text-decoration-thickness:2px}
.tog{font:inherit;color:var(--muted);background:none;border:0;padding:0 2px;margin-left:-1.4em;width:1.4em;cursor:pointer;line-height:inherit}
.tog:hover{color:var(--key)}
.fold>.body{display:inline}
.fold>.dots{display:none}
.fold.shut>.body{display:none}
.fold.shut>.dots{display:inline;color:var(--muted);cursor:pointer}
#pretty{padding-left:1.4em}
#raw{display:none}
body.flat #pretty{display:none}
body.flat #raw{display:block}
.wave{display:inline-block;transform-origin:70% 80%;animation:wave 2.4s ease-in-out 1 .4s}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%,40%{transform:rotate(-8deg)}}
.cursor{display:inline-block;width:.55em;height:1.1em;vertical-align:-.2em;background:var(--key);margin-left:2px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.flash{background:var(--hl);border-radius:3px;transition:background 1.2s}
/* ── pretty-print = the cute version (raw stays a plain browser view) ── */
body:not(.flat){
  --bg:light-dark(#fff0f5,#1f1219);
  --ink:light-dark(#4a2236,#fbe4ee);
  --muted:light-dark(#c98aa6,#a77790);
  --key:light-dark(#d6336c,#ff8fb8);
  --str:light-dark(#3b4cc0,#a9b8ff);
  --note:light-dark(#e0679a,#f39ac1);
  --bar:light-dark(#ffe3ee,#2a1823);
  --line:light-dark(#f6c4d8,#4a2a3b);
  --hl:light-dark(#ffd6e6,#4d2238);
  --card:light-dark(#ffffff,#2a1823);
  background:
    radial-gradient(circle at 1px 1px,light-dark(#f7bcd3,#3d2231) 1.5px,transparent 0) 0 0/22px 22px,
    var(--bg);
}
body:not(.flat) .bar{border-bottom:2px dashed var(--line)}
body:not(.flat) .bar button{color:var(--key);text-decoration-style:wavy}
.card,.hiya{display:none}
body:not(.flat) .hiya{display:block;font:600 clamp(30px,6vw,44px)/1.05 "Caveat",cursive;color:var(--key);margin:10px 0 14px 6px;transform:rotate(-2.5deg);transform-origin:left}
body:not(.flat) .hiya small{display:block;font-size:.5em;color:var(--note);margin:2px 0 0 4px}
body:not(.flat) .card{display:block;position:relative;background:var(--card);border:2px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--line),0 18px 40px light-dark(#f4a6c533,#00000055)}
.win{display:flex;align-items:center;gap:7px;padding:10px 16px;border-bottom:2px dashed var(--line);font-size:13px;color:var(--muted)}
.win i{width:12px;height:12px;border-radius:50%;background:#ff8fb8}
.win i:nth-child(2){background:#ffd166}.win i:nth-child(3){background:#8ecbff}
.win span{margin-left:6px}
body:not(.flat) #pretty{padding:16px 16px 20px calc(16px + 1.4em)}
body:not(.flat) .k{display:inline-block;transition:transform .2s}
body:not(.flat) .k:hover{transform:rotate(-3deg) scale(1.06)}
body:not(.flat) .s a{background:light-dark(#ffe3ee,#4a2a3b);border-radius:999px;padding:0 6px;text-decoration:none}
body:not(.flat) .s a:hover{background:var(--hl)}
body:not(.flat) .tog{color:var(--key)}
body:not(.flat) .cursor{background:none;width:auto;height:auto;color:var(--key);animation:beat 1.2s ease-in-out infinite;vertical-align:0}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
.spark{position:absolute;color:var(--key);pointer-events:none;animation:twinkle 3s ease-in-out infinite}
.spark.a{top:-14px;right:22px;font-size:22px}
.spark.b{top:14px;right:-10px;font-size:14px;color:#ffd166;animation-delay:1s}
.spark.c{bottom:-12px;left:30px;font-size:18px;color:#8ecbff;animation-delay:2s}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1) rotate(0)}50%{opacity:.35;transform:scale(.75) rotate(20deg)}}
@media(prefers-reduced-motion:reduce){.cursor,.wave,.spark,body:not(.flat) .cursor{animation:none}}
@media(min-width:700px){body{font-size:15px}}
@media(max-width:600px){.spark.b{right:4px}}
</style>
</head>
<body>
<div class="bar">
  <label><input type="checkbox" id="pp" checked> pretty-print</label>
  <button type="button" id="foldall">fold all</button>
  <button type="button" id="hello">say hi in swahili</button>
</div>
<main>
  <p class="hiya">hii, thanks for connecting! ♡<small>here's me, as a json file</small></p>
  <div class="card">
    <div class="win" aria-hidden="true"><i></i><i></i><i></i><span>lani.json ♡</span></div>
    <span class="spark a" aria-hidden="true">✦</span><span class="spark b" aria-hidden="true">✦</span><span class="spark c" aria-hidden="true">✿</span>
    <pre id="pretty"></pre>
  </div>
  <pre id="raw"></pre>
</main>
<script>
{
  // ── edit everything below to update the site ──
  // [text, url] pairs become links. "#…" strings in notes{} are little // comments shown after a key.
  const data = {
    name: "nalani chassang",
    greeting: "hi nice to meet you!",
    email: ["lanichassang@gmail.com", "mailto:lanichassang@gmail.com"],
    from: "st lucia → barbados → toronto",
    intro: "i'm a 3rd year at the university of toronto studying economics and african studies, with a minor in math. i care about how economies grow, who that growth actually reaches, and where africa fits in the global economy. i'd love to chat — about econ, policy, or what you're reading!",
    school: {
      university: "university of toronto",
      college: "innis",
      programs: ["economics (major)", "african studies (major)", "mathematics (minor)"],
      scholarship: "lester b. pearson international scholar",
    },
    work: {
prev: [
  "rbc — project delivery specialist intern, healthcare financial products",
  "central bank of barbados — research and economic analysis intern"
]    },
    involved_in: [
      "research advisor @ uoft economics club (global affairs & economic development)",
      "vp internal @ african studies course union",
      "running 'the literary affair', a book club with friends"
    ],
    researching: "why canada's productivity growth stalled, and what that did to real wages and affordability",
    someday: {
      next: "phd in development economics",
      then: "imf / world bank / oecd",
      and_maybe: "a little bookstore somewhere in europe"
    },
    off_the_clock: ["pilates", "baking", "reading (always)", "planet money on repeat"],
    socials: {
      linkedin: ["linkedin", "https://www.linkedin.com/"],
      email: ["say hi", "mailto:lanichassang@gmail.com"]
    }
  };
  const notes = {
    from: "proud bajan and st lucian",
    school: "tap a ♥ to fold any section",
    researching: "in progress, paper coming hopefully this year",
    and_maybe: "the childhood dream, still on the list",
    off_the_clock: "book recs very welcome"
  };
  const hellos = ["hi! 👋", "habari! 👋", "jambo! 👋", "hujambo! 👋"];

  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const isLink = v => Array.isArray(v) && v.length === 2 && typeof v[1] === "string" && /^(https?:|mailto:)/.test(v[1]);
  const str = (v, key) => {
    if (isLink(v)) return `<span class="s">"<a href="${esc(v[1])}" target="_blank" rel="noopener">${esc(v[0])}</a>"</span>`;
    let t = esc(v);
    if (key === "greeting") t = t.replace("👋", '<span class="wave">👋</span>');
    return `<span class="s"${key === "greeting" ? ' id="greet"' : ""}>"${t}"</span>`;
  };

  const render = (v, depth, pretty, key) => {
    const pad = pretty ? "  ".repeat(depth + 1) : "";
    const end = pretty ? "  ".repeat(depth) : "";
    const nl = pretty ? "\n" : "";
    const sep = pretty ? ": " : ":";
    if (typeof v === "string" || isLink(v)) return str(v, key);
    const arr = Array.isArray(v);
    const [o, cl] = arr ? ["[", "]"] : ["{", "}"];
    const rows = arr
      ? v.map(x => pad + render(x, depth + 1, pretty))
      : Object.entries(v).map(([k, x]) => {
          const n = pretty && notes[k] ? `  <span class="c">// ${esc(notes[k])}</span>` : "";
          const isObj = typeof x === "object" && !isLink(x);
          const line = `${pad}<span class="k">"${esc(k)}"</span><span class="p">${sep}</span>${render(x, depth + 1, pretty, k)}`;
          return isObj ? line.replace(/^(\s*)(<span class="k">)/, "$1$2") + "§" + n : line + "§" + n;
        });
    const joined = rows.map((r, i) => {
      const [main, note] = r.split("§");
      return main + (i < rows.length - 1 ? '<span class="p">,</span>' : "") + (note || "");
    }).join(nl);
    const body = `${nl}${joined}${nl}${end}`;
    if (!pretty || depth === 0) return `<span class="p">${o}</span>${body}<span class="p">${cl}</span>`;
    return `<span class="fold"><button type="button" class="tog" aria-label="fold" aria-expanded="true">♥</button><span class="p">${o}</span><span class="body">${body}</span><span class="dots" title="unfold">…</span><span class="p">${cl}</span></span>`;
  };

  const prettyEl = document.getElementById("pretty");
  prettyEl.innerHTML = render(data, 0, true) + '<span class="cursor" aria-hidden="true">♥</span>';
  document.getElementById("raw").innerHTML = render(data, 0, false);

  // place each fold toggle just before its key on the same line
  for (const f of prettyEl.querySelectorAll(".fold")) {
    const btn = f.querySelector(":scope > .tog");
    const prev = f.previousElementSibling?.previousElementSibling;
    if (prev && prev.classList.contains("k")) prev.before(btn);
    btn._fold = f;
  }

  const setFold = (f, shut) => {
    f.classList.toggle("shut", shut);
    const b = prettyEl.querySelector(".tog") && [...prettyEl.querySelectorAll(".tog")].find(x => x._fold === f);
    if (b) { b.textContent = shut ? "♡" : "♥"; b.setAttribute("aria-expanded", String(!shut)); b.setAttribute("aria-label", shut ? "unfold" : "fold"); }
  };
  prettyEl.addEventListener("click", e => {
    const t = e.target.closest(".tog");
    if (t && t._fold) return setFold(t._fold, !t._fold.classList.contains("shut"));
    const d = e.target.closest(".dots");
    if (d) setFold(d.parentElement, false);
  });

  const foldBtn = document.getElementById("foldall");
  foldBtn.addEventListener("click", () => {
    const folds = [...prettyEl.querySelectorAll(".fold")];
    const shutAll = !folds.every(f => f.classList.contains("shut"));
    folds.forEach(f => setFold(f, shutAll));
    foldBtn.textContent = shutAll ? "unfold all" : "fold all";
  });

  let h = 0;
  document.getElementById("hello").addEventListener("click", () => {
    h = (h + 1) % hellos.length;
    const g = document.getElementById("greet");
    if (!g) return;
    g.innerHTML = '"' + esc(hellos[h]).replace("👋", '<span class="wave">👋</span>') + '"';
    g.classList.remove("flash"); void g.offsetWidth; g.classList.add("flash");
    setTimeout(() => g.classList.remove("flash"), 1300);
  });

  const pp = document.getElementById("pp");
  const apply = () => document.body.classList.toggle("flat", !pp.checked);
  pp.addEventListener("change", apply);
  apply();
}
</script>
</body>
</html>
